[package]
name = "openmls_libcrux_crypto"
version = "0.3.1"
edition = "2021"
rust-version.workspace = true
authors = ["OpenMLS Authors"]
description = "A crypto backend for OpenMLS based on libcrux implementing openmls_traits."
license = "MIT"
documentation = "https://docs.rs/openmls_libcrux_crypto"
repository = "https://github.com/openmls/openmls/tree/main/openmls_libcrux_crypto"
readme = "../README.md"

[dependencies]
libcrux-aead = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }
libcrux-ed25519 = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump", features = [
    "rand",
] }
libcrux-hkdf = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }
libcrux-hmac = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }
libcrux-hmac-drbg = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump", features = [
    "rand",
] }
libcrux-sha2 = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }
libcrux-traits = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }

openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }

rand = "0.10"
tls_codec.workspace = true

hpke-rs = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump", features = [
    "hazmat",
    "serialization",
] }
hpke-rs-crypto = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }
hpke-rs-libcrux = { version = "*", git = "https://github.com/celabshq/libcrux", branch = "franziskus/tls_codec-bump" }

# FF1-AES128 backing for the virtual-clients-draft reuse-guard PRP.
# libcrux has no FF1 implementation, so this provider also uses the
# RustCrypto-based `fpe` crate.
fpe = { version = "0.6", optional = true }
aes = { version = "0.8", optional = true }

[features]
extensions-draft = [
    "openmls_traits/extensions-draft",
    "openmls_memory_storage/extensions-draft",
]
draft-ietf-mls-pq-ciphersuites = [
    "openmls_traits/draft-ietf-mls-pq-ciphersuites",
    "openmls_memory_storage/draft-ietf-mls-pq-ciphersuites",
]
virtual-clients-draft = [
    "extensions-draft",
    "openmls_traits/virtual-clients-draft",
    "openmls_memory_storage/virtual-clients-draft",
    "dep:fpe",
    "dep:aes",
]
targeted-messages-draft = ["openmls_traits/targeted-messages-draft"]
