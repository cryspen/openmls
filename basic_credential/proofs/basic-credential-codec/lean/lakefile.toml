name = "BasicCredentialCodec"
version = "0.1.0"
defaultTargets = ["BasicCredentialCodec"]

[[lean_lib]]
name = "BasicCredentialCodec"
# Same as TlsCodec: the extracted names contain `__`.
leanOptions = { weak.linter.style.nameCheck = false }

# The extractions whose Lean names this crate's extraction refers to
# (`-external-names` in the workspace `hax.toml`): tls_codec and openmls_traits.
# TlsCodec: the Lean project of the tls_codec fork that the workspace
# `Cargo.toml` patches tls_codec to (cryspen/formats, same revision). It brings
# the aeneas Lean library (cryspen/aeneas 4aefccc8, the revision of the aeneas
# binary built by `proofs/setup.sh`), hax-lean and mathlib with it.
[[require]]
name = "TlsCodec"
git = "https://github.com/cryspen/formats"
rev = "eb9795819d79469ab94d76585559c494573a58f6"
subDir = "tls_codec/proofs/tls-codec/lean"

[[require]]
name = "TraitsCodec"
path = "../../../../traits/proofs/traits-codec/lean"
